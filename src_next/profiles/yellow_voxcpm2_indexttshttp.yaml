# yellow_voxcpm2_indexttshttp.yaml
#
# 完整 pipeline profile（黄区）：
#   region    = yellow
#   voicebank = voxcpm2_http  (OpenBMB VoxCPM2 voice_design via HTTP)
#   tts       = indextts_http (IndexTTS-2 via HTTP)
#
# 和 yellow_qwen3http_indexttshttp.yaml 的差异：
#   * voicebank 换成 VoxCPM2（48 kHz 输出）；
#   * VoxCPM2 endpoint 是 /v1/tts/synthesize（用作 voicebank）；
#   * VoxCPM2 不需要 language 字段（自动识别 30 种语言）；
#   * voicebank 生成的 wav 是 48 kHz，indextts_http adapter 自行重采样到 22 kHz。
#
# 黄区所有模型都通过内网 HTTP API 调用，不走 subprocess / WSL / 本地 venv。
# 服务器地址参考项目根 usage_guide_*.md：
#   Gemma4 LLM:  http://10.50.121.123:8000/v1/chat/completions
#   VoxCPM2:     http://10.50.121.102:8012
#   IndexTTS-2:  http://10.50.121.102:8009
#
# 5 个必填块：llm / voicebank / tts / output / pipeline

name: yellow_voxcpm2_indexttshttp
region: yellow
description: |
  黄区完整链路：Gemma4-26B-A4B LLM + VoxCPM2 VoiceDesign HTTP voicebank
  + IndexTTS-2 HTTP tts。所有模型都通过内网 HTTP API 调用。
  VoxCPM2 输出 48 kHz wav 作为角色音色参考，下游 indextts_http 自行重采样。

# ── llm：黄区 Gemma4 ───────────────────────────────────────────────
# 关键：bypass_proxy=true，黄区内网 10.50.121.123 必须绕过开发机全局代理。
llm:
  backend: gemma4_http
  base_url: "http://10.50.121.123:8000/v1/chat/completions"
  model: "gemma-4-26B-A4B"
  timeout: 300
  bypass_proxy: true

# ── voicebank：VoxCPM2 VoiceDesign HTTP ────────────────────────────
# 服务地址参考 usage_guide_voicecpm2.md。
# VoxCPM2 把音色描述内嵌到 text 开头："(描述)实际文本"。
# 输出 48 kHz wav，下游 TTS adapter 自行重采样。
voicebank:
  backend: voxcpm2_http
  base_url: "http://10.50.121.102:8012"
  output_subdir: "voicebank"
  extra_args:
    reference_text: "你好，欢迎使用 VoxCPM2 角色音色生成系统。"
    # VoxCPM2 显存 8 GB，比 Qwen3 大；首次推理有 30s warm-up，给 90s 余量
    timeout_per_char: 90
    # 并发线程数（角色通常 3-5 个，4 线程足够把总耗时压到接近单次请求）
    max_workers: 4
    # 黄区内网调用必须 bypass 开发机全局代理
    bypass_proxy: true

# ── tts：IndexTTS-2 HTTP ───────────────────────────────────────────
# 服务地址参考 usage_guide_indextts.md。
# IndexTTS-2 支持 8 维 emotion_vector + emotion_alpha；adapter 自动把
# TTSInstruction.emotion 映射到向量，emotion_intensity 映射到 alpha。
tts:
  backend: indextts_http
  base_url: "http://10.50.121.102:8009"
  output_subdir: "audio_segments"
  extra_args:
    # 单段合成请求超时（秒）
    timeout_per_seg: 60
    # 并发线程数（默认 4；段数多时增大可降 RTF）
    max_workers: 4
    bypass_proxy: true
    # 下面这些采样参数是可选的；不写就用服务端默认值。
    # temperature: 0.8
    # top_p: 0.8
    # top_k: 30
    # num_beams: 3
    # repetition_penalty: 10.0
    # max_text_tokens: 120
    # max_mel_tokens: 1500
    # interval_silence: 200

# ── output：黄区 pipeline 输出根目录 ───────────────────────────────
# 约定：<统一根>/<profile_name>/，不同 yaml 的产物在同一个 output-src-next/
# 大文件夹下分目录存放，方便对比同一文本在不同后端组合下的效果。
output:
  root: "output-src-next/yellow_voxcpm2_indexttshttp"

# ── pipeline：流程开关 ─────────────────────────────────────────────
pipeline:
  save_intermediate_json: true
  reuse_existing: false
  stop_on_tts_error: false
  voicebank_critic:
    enabled: true
    max_retries: 2
    score_threshold: 0.6
    gender_threshold: 0.7

notes:
  - "黄区所有模型走内网 HTTP，不走 subprocess / WSL / 本地 venv。"
  - "Gemma4 / VoxCPM2 / IndexTTS 服务器地址见 usage_guide_*.md。"
  - "黄区到蓝区切换只换 profile，不改 adapter / pipeline 代码。"
  - "HTTP adapter 默认 bypass_proxy=true（黄区开发机有全局代理时强制无代理）。"
  - "VoxCPM2 输出 48 kHz；下游 indextts_http adapter 自行重采样到 22 kHz。"
  - "VoxCPM2 voice_design 模式：text 开头括号内嵌描述，无 reference_audio。"
  - "克隆模式（reference_audio / prompt_audio）留 v2，需要 core/data_models.py 扩展字段。"
